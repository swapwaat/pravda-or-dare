<style>

</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Правда или Действие</div>
    <div class="subtitle">Выбирай карточку и не отступай 😈</div>
  </div>

  <!-- MODE -->
  <section id="modeScreen" class="screen active">
    <div class="players-head">Как будем играть?</div>
    <div class="mode-options">
      <button class="mode-btn" onclick="chooseMode('single')">
        <div class="mode-title">👫 Одна пара</div>
        <div class="mode-desc">Два игрока, ходы переходят от одного к другому.</div>
      </button>
      <button class="mode-btn" onclick="chooseMode('multi')">
        <div class="mode-title">👥 Несколько пар</div>
        <div class="mode-desc">Добавь несколько пар — приложение будет отслеживать общий порядок ходов.</div>
      </button>
    </div>
  </section>

  <!-- PLAYERS -->
  <section id="playersScreen" class="screen">
    <div class="game-top"><button class="back" onclick="showModeScreen()">← Назад</button><div></div></div>
    <div class="players-head">Игроки</div>
    <div id="playersList" class="players-list"></div>
    <div class="player-actions">
      <button id="addPairBtn" class="secondary-btn" onclick="addPair()">+ Добавить пару</button>
      <button class="primary-btn" onclick="confirmPlayers()">Продолжить →</button>
    </div>
  </section>

  <!-- LEVELS -->
  <section id="levelsScreen" class="screen">

    <div class="levels">

      <button class="level" onclick="startGame(0)">
        <span class="level-icon">🎲</span>
        <div class="level-title">Классический</div>
        <div class="level-desc">Лёгкие вопросы и забавные задания.</div>
      </button>

      <button class="level" onclick="startGame(1)">
        <span class="level-icon">😉</span>
        <div class="level-title">Флирт</div>
        <div class="level-desc">Больше флирта, смелости и личных вопросов.</div>
      </button>

      <button class="level" onclick="startGame(2)">
        <span class="level-icon">🔥</span>
        <div class="level-title">18+</div>
        <div class="level-desc">Для взрослых. Максимум интимности без лишних рамок.</div>
      </button>

      <button class="level" onclick="startGame(3)">
        <span class="level-icon">😈</span>
        <div class="level-title">Без рамок</div>
        <div class="level-desc">Самые смелые вопросы, признания и задания.</div>
      </button>

    </div>

  </section>

  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="game-top">
      <button class="back" onclick="showLevels()">← Уровни</button>
      <div>
        <div id="turnBadge" class="turn-badge">Ход: —</div>
        <div id="currentPair" class="current-pair"></div>
        <div id="levelName" class="level-name"></div>
      </div>
    </div>

    <div class="card">

      <div id="typeLabel" class="type">ПРАВДА</div>

      <div id="question" class="question">
        Выбери «Правда» или «Действие»
      </div>

      <div id="timerBox" class="timer-box">

        <div id="timer" class="timer">00:00</div>

        <div class="timer-buttons">
          <button id="timerStart" class="timer-btn primary" onclick="toggleTimer()">
            ▶ Запустить
          </button>

          <button class="timer-btn" onclick="resetTimer()">
            ↻ Сбросить
          </button>
        </div>

      </div>

    </div>

    <div class="actions">
      <button class="choice truth" onclick="showCard('truth')">
        Правда
      </button>

      <button class="choice dare" onclick="showCard('dare')">
        Действие
      </button>
    </div>

    <button class="next" onclick="nextCard()">
      Следующая карточка →
    </button>

    <div class="hint">
      Свайп влево — следующая карточка · вправо — назад
    </div>

  </section>

</div>

<script>

/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */

let currentLevel = 0;
let currentType = null;
let currentCard = null;
let gameMode = null;
let pairs = [];
let players = [];
let currentPlayerIndex = 0;

let used = {
  truth: [],
  dare: []
};

let timerInterval = null;
let timerSeconds = 0;
let timerRemaining = 0;
let timerEnd = 0;
let timerRunning = false;


/* =========================================================
   DOM
========================================================= */

const modeScreen = document.getElementById("modeScreen");
const playersScreen = document.getElementById("playersScreen");
const levelsScreen = document.getElementById("levelsScreen");
const playersList = document.getElementById("playersList");
const addPairBtn = document.getElementById("addPairBtn");
const turnBadge = document.getElementById("turnBadge");
const currentPair = document.getElementById("currentPair");
const gameScreen = document.getElementById("gameScreen");
const levelName = document.getElementById("levelName");
const typeLabel = document.getElementById("typeLabel");
const question = document.getElementById("question");

const timerBox = document.getElementById("timerBox");
const timer = document.getElementById("timer");
const timerStart = document.getElementById("timerStart");


/* =========================================================
   ИГРА
========================================================= */

function chooseMode(mode) {
  gameMode = mode;
  pairs = mode === "single" ? [{ players: [
    { name: "Игрок 1", gender: "male" },
    { name: "Игрок 2", gender: "female" }
  ] }] : [{ players: [
    { name: "Игрок 1", gender: "male" },
    { name: "Игрок 2", gender: "female" }
  ] }];
  showPlayersScreen();
}

function showModeScreen() {
  playersScreen.classList.remove("active");
  levelsScreen.classList.remove("active");
  gameScreen.classList.remove("active");
  modeScreen.classList.add("active");
}

function showPlayersScreen() {
  modeScreen.classList.remove("active");
  levelsScreen.classList.remove("active");
  gameScreen.classList.remove("active");
  playersScreen.classList.add("active");
  renderPlayers();
}

function renderPlayers() {
  playersList.innerHTML = pairs.map((pair, pi) => `
    <div class="player-card">
      <div class="pair-title">Пара ${pi + 1}</div>
      ${pair.players.map((player, pj) => `
        <div class="player-row">
          <input class="player-input" value="${escapeHtml(player.name)}" placeholder="Имя" onchange="savePlayerName(${pi},${pj},this.value)">
          <select class="gender-select" onchange="savePlayerGender(${pi},${pj},this.value)">
            <option value="male" ${player.gender === "male" ? "selected" : ""}>Мужчина</option>
            <option value="female" ${player.gender === "female" ? "selected" : ""}>Женщина</option>
          </select>
        </div>`).join("")}
    </div>`).join("");
  addPairBtn.style.display = gameMode === "multi" && pairs.length < 6 ? "block" : "none";
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

function savePlayerName(pi, pj, value) { pairs[pi].players[pj].name = value.trim() || `Игрок ${pj + 1}`; }
function savePlayerGender(pi, pj, value) { pairs[pi].players[pj].gender = value; }

function addPair() {
  if (gameMode !== "multi" || pairs.length >= 6) return;
  const n = pairs.length * 2 + 1;
  pairs.push({ players: [
    { name: `Игрок ${n}`, gender: "male" },
    { name: `Игрок ${n + 1}`, gender: "female" }
  ]});
  renderPlayers();
}

function confirmPlayers() {
  players = pairs.flatMap((pair, pi) => pair.players.map((player, pj) => ({
    ...player, pairIndex: pi, playerIndex: pj,
    name: player.name.trim() || `Игрок ${pi * 2 + pj + 1}`
  })));
  if (players.length < 2) return;
  currentPlayerIndex = 0;
  playersScreen.classList.remove("active");
  levelsScreen.classList.add("active");
}

function updateTurnDisplay() {
  if (!players.length) { turnBadge.textContent = "Ход: —"; currentPair.textContent = ""; return; }
  const player = players[currentPlayerIndex];
  turnBadge.textContent = `Ход: ${player.name}`;
  currentPair.textContent = gameMode === "multi" ? `Пара ${player.pairIndex + 1} · ${player.gender === "male" ? "Мужчина" : "Женщина"}` : (player.gender === "male" ? "Мужчина" : "Женщина");
}

function startGame(level) {
  currentLevel = level;
  used = { truth: [], dare: [] };
  levelsScreen.classList.remove("active");
  gameScreen.classList.add("active");
  levelName.textContent = decks[level].name;
  currentPlayerIndex = 0;
  updateTurnDisplay();
  resetCurrentCard();
  question.textContent = "Выбери «Правда» или «Действие»";
  typeLabel.textContent = "ВЫБЕРИ КАРТОЧКУ";
}

function showLevels() {
  stopTimer();
  gameScreen.classList.remove("active");
  levelsScreen.classList.add("active");
}


function resetCurrentCard() {
  stopTimer();

  currentCard = null;
  currentType = null;

  timerBox.classList.remove("visible");
  timer.textContent = "00:00";
  timer.classList.remove("finished");
  timerStart.textContent = "▶ Запустить";
}


function getRandomCard(type) {
  const deck = decks[currentLevel][type];

  if (used[type].length >= deck.length) {
    used[type] = [];
  }

  let available = [];

  for (let i = 0; i < deck.length; i++) {
    if (!used[type].includes(i)) {
      available.push(i);
    }
  }

  const index = available[Math.floor(Math.random() * available.length)];

  used[type].push(index);

  return deck[index];
}


function showCard(type) {
  stopTimer();

  currentType = type;
  currentCard = getRandomCard(type);

  const isTruth = type === "truth";

  typeLabel.textContent = isTruth ? "ПРАВДА" : "ДЕЙСТВИЕ";

  if (isTruth) {
    typeLabel.style.color = "#b9ccff";
  } else {
    typeLabel.style.color = "#ffb0d0";
  }

  if (typeof currentCard === "string") {
    question.textContent = currentCard;

    timerBox.classList.remove("visible");
    timerSeconds = 0;
    timerRemaining = 0;
    return;
  }

  question.textContent = currentCard.text;

  if (currentCard.seconds) {
    timerSeconds = currentCard.seconds;
    timerRemaining = currentCard.seconds;

    timerBox.classList.add("visible");
    timer.classList.remove("finished");

    updateTimerDisplay();
    timerStart.textContent = "▶ Запустить";
  } else {
    timerBox.classList.remove("visible");
  }
}


function nextCard() {
  if (!players.length) {
    showCard(Math.random() < 0.5 ? "truth" : "dare");
    return;
  }
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateTurnDisplay();
  showCard(Math.random() < 0.5 ? "truth" : "dare");
}

/* =========================================================
   ТАЙМЕР
========================================================= */

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));

  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0")
  );
}


function updateTimerDisplay() {
  timer.textContent = formatTime(timerRemaining);
}


function toggleTimer() {
  if (!currentCard || !currentCard.seconds) return;

  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}


function startTimer() {
  if (!currentCard || !currentCard.seconds) return;

  if (timerRemaining <= 0) {
    timerRemaining = timerSeconds;
  }

  timerRunning = true;

  timerEnd = Date.now() + timerRemaining * 1000;

  timerStart.textContent = "⏸ Пауза";

  clearInterval(timerInterval);

  timerInterval = setInterval(updateRunningTimer, 100);
  updateRunningTimer();
}


function updateRunningTimer() {
  if (!timerRunning) return;

  const remainingMs = timerEnd - Date.now();

  if (remainingMs <= 0) {
    timerRemaining = 0;
    updateTimerDisplay();

    timerRunning = false;
    clearInterval(timerInterval);
    timerInterval = null;

    timer.classList.add("finished");
    timerStart.textContent = "✓ Время вышло";

    return;
  }

  timerRemaining = remainingMs / 1000;
  updateTimerDisplay();
}


function pauseTimer() {
  if (!timerRunning) return;

  const remainingMs = Math.max(0, timerEnd - Date.now());

  timerRemaining = remainingMs / 1000;

  timerRunning = false;

  clearInterval(timerInterval);
  timerInterval = null;

  timerStart.textContent = "▶ Продолжить";

  updateTimerDisplay();
}


function stopTimer() {
  timerRunning = false;

  clearInterval(timerInterval);
  timerInterval = null;

  timerRemaining = 0;
  timerEnd = 0;
}


function resetTimer() {
  if (!currentCard || !currentCard.seconds) return;

  stopTimer();

  timerRemaining = timerSeconds;

  timer.classList.remove("finished");

  timerStart.textContent = "▶ Запустить";

  updateTimerDisplay();
}


/* =========================================================
   СВАЙПЫ
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", function(e) {
  if (!gameScreen.classList.contains("active")) return;

  const touch = e.changedTouches[0];

  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: true });


document.addEventListener("touchend", function(e) {
  if (!gameScreen.classList.contains("active")) return;

  const touch = e.changedTouches[0];

  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;

  if (Math.abs(deltaX) < 70) return;
  if (Math.abs(deltaX) < Math.abs(deltaY)) return;

  if (deltaX < 0) {
    nextCard();
  } else {
    showLevels();
  }
}, { passive: true });


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener("keydown", function(e) {
  if (!gameScreen.classList.contains("active")) return;

  if (e.key === "ArrowLeft") {
    showLevels();
  }

  if (e.key === "ArrowRight") {
    nextCard();
  }

  if (e.key === " " && currentCard && currentCard.seconds) {
    e.preventDefault();
    toggleTimer();
  }
});

</script>
